# Pinned release — 0.2.0
#
# A reproducible set: the core chart structure + every image pinned to the 0.2.0 release, so
# restarts and re-installs are stable. Install (from helm/amortized-rhoai):
#
#   ./install.sh amortized-gateway -f releases/0.2.0.yaml
#
# Source: amortized v0.2.0 tag (GitHub release 0.2.0, #540); core chart 0.4.0; every control-plane
# and job image at :0.2.0. The training image (built upstream, training-hub) is :0.2.0, retagged
# from :latest at the v0.2.0 tag by containers.yml retag-training — verified present in ghcr.
studio-gateway:
  chart:
    version: "0.4.0"                               # per-user core chart (OCI), 0.2.0 release
  image:
    tag: "0.2.0"                                   # studio-gateway
  serverImageTag: "0.2.0"                          # per-user server (ghcr.io/amortized-ai/amortized)
  jobImageTag: "0.2.0"                             # eval, data-designer (SDG), document
  trainingImageTag: "0.2.0"                        # training (upstream; retagged from latest at v0.2.0)
  morty:
    image: ghcr.io/amortized-ai/morty:0.2.0        # OpenShell-sandboxed Morty
pluginFrontend:
  image:
    tag: "0.2.0"                                   # dashboard plugin (amortized-studio)
