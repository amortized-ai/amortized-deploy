# Pinned release — 0.3.0
#
# A reproducible set: the core chart structure + every image pinned to the 0.3.0 release, so
# restarts and re-installs are stable. Install (from helm/amortized-rhoai):
#
#   ./install.sh amortized-gateway -f releases/0.3.0.yaml
#
# Source: amortized v0.3.0 tag (GitHub release 0.3.0, #584) — classification-head classifier
# training as the default classifier path (#579) and VRAM estimates from training-hub (#577);
# core chart 0.5.0; every control-plane and job image at :0.3.0. The training image (built
# upstream, training-hub 0.12.0) is :0.3.0, retagged from :latest at the v0.3.0 tag by
# containers.yml retag-training — verified present in ghcr. Upgrading from 0.2.x: the server's
# migrate init container applies DB migration 0005 automatically.
studio-gateway:
  chart:
    version: "0.5.0"                               # per-user core chart (OCI), 0.3.0 release
  image:
    tag: "0.3.0"                                   # studio-gateway
  serverImageTag: "0.3.0"                          # per-user server (ghcr.io/amortized-ai/amortized)
  jobImageTag: "0.3.0"                             # eval, data-designer (SDG), document
  trainingImageTag: "0.3.0"                        # training (upstream; retagged from latest at v0.3.0)
  morty:
    image: ghcr.io/amortized-ai/morty:0.3.0        # OpenShell-sandboxed Morty
pluginFrontend:
  image:
    tag: "0.3.0"                                   # dashboard plugin (amortized-studio)
