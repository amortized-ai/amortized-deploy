# Pinned release — 2026-10-06
#
# A reproducible set: the core chart structure + every image pinned to a fixed tag, so restarts
# and re-installs are stable. Install (from helm/amortized-rhoai):
#
#   ./install.sh amortized-gateway -f releases/2026-10-06.yaml
#
# Source (amortized main): core chart 0.3.0; server, job, and studio-gateway images from 9a12321
# (#494); morty and the dashboard plugin unchanged (bebb5c4 / b75d74d). The training image is
# built upstream (training-hub), pinned to the dev-embedding tag pending a stable 0.2.0.
studio-gateway:
  chart:
    version: "0.3.0"                               # pin the per-user core chart structure
  image:
    tag: sha-9a12321                               # studio-gateway
  serverImageTag: sha-9a12321                      # per-user server
  jobImageTag: sha-9a12321                         # eval, data-designer (SDG), document
  trainingImageTag: dev-embedding                  # training (built upstream; dev tag -> 0.2.0 when cut)
  morty:
    image: ghcr.io/amortized-ai/morty:sha-bebb5c4  # OpenShell-sandboxed Morty
pluginFrontend:
  image:
    tag: sha-b75d74d                               # dashboard plugin (amortized-studio)
