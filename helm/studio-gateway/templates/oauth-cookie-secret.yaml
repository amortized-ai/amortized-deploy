{{- /*
oauth-proxy cookie secret. Generated once on first install and preserved thereafter
(lookup + resource-policy:keep) so upgrades don't rotate it and log users out.
*/ -}}
{{- $name := include "studio-gateway.cookieSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $cookie := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "session_secret") -}}
{{- $cookie = index $existing.data "session_secret" -}}
{{- else -}}
{{- $cookie = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "studio-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  session_secret: {{ $cookie }}
