apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "studio-gateway.fullname" . }}
  labels:
    {{- include "studio-gateway.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "studio-gateway.fullname" . }}
  port:
    targetPort: public
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
